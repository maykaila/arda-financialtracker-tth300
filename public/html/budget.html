<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <h1>Monthly Budgets</h1>
        <nav class="nav-links">
            <a href="../html/index.html">Tracker</a>
            <a href="../html/budget.html" class="active">Budgets</a>
            <a href="../html/goals.html">Goals</a>
            <a href="../html/analytics.html">Analytics</a>
        </nav>
    </header>

    <main class="container">
        <!-- Budget Health Overview -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Monthly Limit</h4>
                <h1 id="budget-total-limit">₱0.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Spent</h4>
                <p id="budget-total-spent">₱0.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Remaining</h4>
                <p id="budget-remaining">₱0.00</p>
            </div>
        </section>

        <!-- Main Budget Section -->
        <section class="content-grid">
            <!-- Left: Active Budgets -->
            <div class="card">
                <h3>Active Categories</h3>
                <div id="budget-category-list" class="active-categories-list"></div>
            </div>

            <!-- Right: Set Budget Form -->
            <div class="card">
                <h3>Set Category Limit</h3>
                <form id="budget-form">
                    <div class="form-group">
                        <label for="budget-category">Category</label>
                        <input type="text" id="budget-category" placeholder="e.g. Dining Out, Utilities" required>
                    </div>

                    <div class="form-group">
                        <label for="budget-limit">Monthly Limit (₱)</label>
                        <input type="number" id="budget-limit" placeholder="0.00" step="0.01" min="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
