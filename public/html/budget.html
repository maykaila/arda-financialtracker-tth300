<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner - Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Monthly Budgets</h1>
        <nav class="nav-links">
            <a href="index.html">Tracker</a>
            <a href="budget.html" class="active">Budgets</a>
            <a href="goals.html">Goals</a>
            <a href="analytics.html">Analytics</a>
        </nav>
    </header>

    <main class="container">
        <!-- Budget Health Overview -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Monthly Limit</h4>
                <h1>₱2,100.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Spent</h4>
                <p>₱1,340.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Remaining</h4>
                <p>₱760.00</p>
            </div>
        </section>

        <!-- Main Budget Section -->
        <section class="content-grid">
            <!-- Left: Active Budgets -->
            <div class="card">
                <h3>Active Categories</h3>
                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">Groceries & Food</span>
                        <span class="amount">₱420 / ₱600</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 70%; background-color: #5c93d9;"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">Rent & Housing</span>
                        <span class="amount">₱800 / ₱800</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 100%; background-color: #f26888;"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">Internet & Bills</span>
                        <span class="amount">₱120 / ₱200</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 60%; background-color: #5c93d9;"></div>
                    </div>
                </div>
            </div>

            <!-- Right: Set Budget Form -->
            <div class="card">
                <h3>Set Category Limit</h3>
                <form id="budget-form">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. Dining Out, Utilities" required>
                    </div>

                    <div class="form-group">
                        <label for="limit">Monthly Limit (₱)</label>
                        <input type="number" id="limit" placeholder="0.00" step="0.01" min="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
