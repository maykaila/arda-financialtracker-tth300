<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Financial Tracker</h1>
        <nav class="nav-links">
            <a href="index.html" class="active">Tracker</a>
            <a href="budget.html">Budgets</a>
            <a href="goals.html">Goals</a>
            <a href="analytics.html">Analytics</a>
        </nav>
    </header>

    <main class="container">
        <!-- Top Metrics Row -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Balance</h4>
                <h1 id="total-balance">₱0.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Income</h4>
                <p id="total-income">+₱0.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Total Expenses</h4>
                <p id="total-expense">-₱0.00</p>
            </div>
        </section>

        <!-- Main Content (Two Columns) -->
        <section class="content-grid">
            <!-- Left Column: Transaction History -->
            <div class="card">
                <h3>Transaction History</h3>
                <ul id="transaction-list" class="transaction-list">
                    <!-- Transactions injected dynamically via JS -->
                </ul>
            </div>

            <!-- Right Column: Form (Create / Update) -->
            <div class="card">
                <h3 id="form-heading">Add New Transaction</h3>
                <form id="transaction-form">
                    <input type="hidden" id="edit-id" value="">

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description..." required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="amount">Amount (₱)</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Add Transaction</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
