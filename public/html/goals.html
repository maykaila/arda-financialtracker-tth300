<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <h1>Savings Goals</h1>
        <nav class="nav-links">
            <a href="../html/index.html">Tracker</a>
            <a href="../html/budget.html">Budgets</a>
            <a href="../html/goals.html" class="active">Goals</a>
            <a href="../html/analytics.html">Analytics</a>
        </nav>
    </header>

    <main class="container">
        <!-- Target Overview -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Saved</h4>
                <h1 id="goal-total-saved">₱0.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Target</h4>
                <p id="goal-total-target">₱0.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Overall Progress</h4>
                <p id="goal-total-progress">0.0%</p>
            </div>
        </section>

        <!-- Main Goals Section -->
        <section class="content-grid">
            <!-- Left: Goal Cards -->
            <div class="card">
                <h3>Target Vaults</h3>
                <div id="vault-list" class="target-vaults-list"></div>
            </div>

            <!-- Right: Create Goal Form -->
            <div class="card">
                <h3 id="goal-form-heading">Create New Goal</h3>
                <form id="goal-form">
                    <input type="hidden" id="goal-edit-id" value="">

                    <div class="form-group">
                        <label for="goal-name">Goal Name</label>
                        <input type="text" id="goal-name" placeholder="e.g. Dream Trip, Camera" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="goal-target">Target (₱)</label>
                            <input type="number" id="goal-target" placeholder="5000" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="goal-current">Current (₱)</label>
                            <input type="number" id="goal-current" placeholder="0" step="0.01" required>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="goal-submit-btn" class="btn btn-primary">Create Vault</button>
                        <button type="button" id="goal-cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
