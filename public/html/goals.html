<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Goals - Financial Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Savings Goals</h1>
        <nav class="nav-links">
            <a href="index.html">Tracker</a>
            <a href="budget.html">Budgets</a>
            <a href="goals.html" class="active">Goals</a>
            <a href="analytics.html">Analytics</a>
        </nav>
    </header>

    <main class="container">
        <!-- Target Overview -->
        <section class="overview-grid">
            <div class="card balance-card">
                <h4>Total Saved</h4>
                <h1>₱4,850.00</h1>
            </div>

            <div class="card summary-box income">
                <h4>Total Target</h4>
                <p>₱10,000.00</p>
            </div>

            <div class="card summary-box expense">
                <h4>Overall Progress</h4>
                <p>48.5%</p>
            </div>
        </section>

        <!-- Main Goals Section -->
        <section class="content-grid">
            <!-- Left: Goal Cards -->
            <div class="card">
                <h3>Target Vaults</h3>
                
                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">Emergency Fund</span>
                        <span class="amount">₱3,000 / ₱5,000 (60%)</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 60%; background-color: #5c93d9;"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">Summer Vacation</span>
                        <span class="amount">₱1,200 / ₱2,000 (60%)</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 60%; background-color: #f26888;"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-labels">
                        <span class="desc">New Laptop Setup</span>
                        <span class="amount">₱650 / ₱1,500 (43%)</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 43%; background-color: #5c93d9;"></div>
                    </div>
                </div>
            </div>

            <!-- Right: Create Goal Form -->
            <div class="card">
                <h3>Create New Goal</h3>
                <form id="goal-form">
                    <div class="form-group">
                        <label for="goal-name">Goal Name</label>
                        <input type="text" id="goal-name" placeholder="e.g. Dream Trip, Camera" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="target-amount">Target (₱)</label>
                            <input type="number" id="target-amount" placeholder="5000" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="current-amount">Current (₱)</label>
                            <input type="number" id="current-amount" placeholder="0" step="0.01" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Vault</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
